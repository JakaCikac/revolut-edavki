[tool.poetry]
name = "revolut-edavki"
version = "1.0.0"
description = "Tax report generator for Slovenian Financial Administration"
authors = ["openhands <openhands@all-hands.dev>"]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.0"
flask-cors = "^5.0.1"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
cryptography = "^42.0.2"
defusedxml = "^0.7.1"
flask-limiter = "^3.5.0"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
pylint = "^3.0.3"
bandit = "^1.7.6"
black = "^24.1.1"
isort = "^5.13.2"
pre-commit = "^3.6.0"
types-requests = "^2.31.0"
pandas-stubs = "^2.1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
revolut-edavki = "revolut_edavki.server:main"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=revolut_edavki --cov-report=term-missing --cov-report=html"