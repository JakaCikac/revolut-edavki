[tool.poetry]
name = "revolut-edavki"
version = "1.0.0"
description = "Tax report generator for Slovenian Financial Administration"
authors = ["openhands <openhands@all-hands.dev>"]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.0"
flask-cors = "^5.0.1"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
cryptography = "^42.0.2"
defusedxml = "^0.7.1"
flask-limiter = "^3.5.0"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
revolut-edavki = "revolut_edavki.server:main"