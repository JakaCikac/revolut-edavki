version: '3.8'

services:
  web:
    build: .
    ports:
      - "55952:55952"
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    environment:
      - DEBUG=true
      - TAX_SALT=${TAX_SALT:-openhands_secure_salt_123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55952"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    command: pytest tests/ -v --cov=revolut_edavki --cov-report=term-missing