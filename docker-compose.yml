services:
  web:
    build: .
    container_name: revolut-edavki
    ports:
      - "59855:59855"
    volumes:
      # Mount uploads directory for persistent storage
      - ./uploads:/app/uploads
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:59855')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
